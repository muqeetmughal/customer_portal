{% extends "templates/web.html" %}

{% block page_content %}
<div class="container" style="max-width: 400px; margin-top: 50px;">
    <div class="card shadow">
        <div class="card-body">
            <h3 class="text-center mb-4">Setup Your Portal Password</h3>
            
            <div id="setup-form">
                <div class="form-group mb-3">
                    <label for="password">New Password</label>
                    <input type="password" id="password" class="form-control" required minlength="8">
                </div>
                <div class="form-group mb-3">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" class="form-control" required>
                </div>
                <button id="btn-submit" class="btn btn-primary w-100">Create Account</button>
            </div>

            <div id="success-message" class="text-center d-none">
                <div class="alert alert-success">
                    Your account has been created successfully!
                </div>
                <p>You can now log in to the portal.</p>
                <a id="portal-link" href="#" class="btn btn-success">Go to Portal Dashboard</a>
            </div>

            <div id="error-message" class="alert alert-danger mt-3 d-none"></div>
        </div>
    </div>
</div>

<script>
frappe.ready(function() {
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    const portalUrl = window.location.protocol + "//" + window.location.hostname + ":8080/customer-portal/dashboard";
    $('#portal-link').attr('href', portalUrl);

    if (!token) {
        $('#setup-form').addClass('d-none');
        $('#error-message').text('Invalid or missing invitation token.').removeClass('d-none');
        return;
    }

    $('#btn-submit').on('click', function() {
        const password = $('#password').val();
        const confirm_password = $('#confirm_password').val();

        if (password.length < 8) {
            showError('Password must be at least 8 characters long.');
            return;
        }

        if (password !== confirm_password) {
            showError('Passwords do not match.');
            return;
        }

        $('#btn-submit').prop('disabled', true).text('Processing...');
        $('#error-message').addClass('d-none');

        frappe.call({
            method: 'customer_portal.api.customer_portal.accept_invitation',
            args: {
                token: token,
                password: password
            },
            callback: function(r) {
                if (r.message && r.message.status === 'success') {
                    $('#setup-form').addClass('d-none');
                    $('#success-message').removeClass('d-none');
                } else {
                    showError(r.message ? r.message.message : 'An error occurred.');
                    $('#btn-submit').prop('disabled', false).text('Create Account');
                }
            },
            error: function(r) {
                showError('Failed to connect to the server.');
                $('#btn-submit').prop('disabled', false).text('Create Account');
            }
        });
    });

    function showError(msg) {
        $('#error-message').text(msg).removeClass('d-none');
    }
});
</script>
{% endblock %}
